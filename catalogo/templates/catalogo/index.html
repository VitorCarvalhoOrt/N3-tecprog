{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Minha confeitaria</title>
    <link rel="stylesheet" href="{% static 'catalogo/style.css' %}">
</head>

<body>
    <h1>Bem-vindo a Minha Confeitaria</h1>
    <p>Escolha uma das opções abaixo:</p>
    <ul>
        <li><a href="{% url 'catalogo:lista_bolos' %}">Nossos Bolos</a></li>
        {% if user.is_authenticated %}
        <p>Olá, {{ user.username }}!</p>
        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit">Sair (Logout)</button>
        </form>
        <li><a href="{% url 'catalogo:novo_bolo' %}">Novo Bolo</a></li>
        {% else %}
        <a href="{% url 'login' %}">
            Área do Funcionário (Entrar)
        </a>
        {% endif %}
    </ul>
</body>

</html>
